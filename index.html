<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>期权分析工具</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/jstat@1.9.3/dist/jstat.min.js"></script>
    <script src="config.js"></script>
    <script src="calculator.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
            color: #333;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .header h1 {
            font-size: 28px;
            font-weight: bold;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        
        .panel {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        
        .panel-header {
            background: #f8f9fa;
            padding: 15px 20px;
            border-bottom: 1px solid #e8eaed;
            font-weight: bold;
            font-size: 14px;
            color: #333;
        }
        
        .panel-content {
            padding: 20px;
        }
        
        .control-group {
            margin-bottom: 20px;
        }
        
        .control-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 13px;
            color: #555;
        }
        
        select, input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
            font-family: inherit;
        }
        
        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid #e8eaed;
        }
        
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 13px;
            font-weight: 500;
            color: #999;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: all 0.3s;
        }
        
        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }
        
        .tab:hover {
            color: #333;
        }
        
        .chart-container {
            width: 100%;
            height: 400px;
            margin-bottom: 20px;
        }
        
        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        
        .table thead {
            background: #f8f9fa;
        }
        
        .table th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #555;
            border-bottom: 1px solid #e8eaed;
        }
        
        .table td {
            padding: 10px 12px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .table tbody tr:hover {
            background: #f8f9fa;
        }
        
        .table tbody tr.selected {
            background: #e8eaf6;
        }
        
        .price-up {
            color: #f23645;
        }
        
        .price-down {
            color: #22ab94;
        }
        
        .full-width {
            grid-column: 1 / -1;
        }
        
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .btn {
            flex: 1;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .btn-danger {
            background: #f23645;
            color: white;
        }
        
        .btn-danger:hover {
            background: #d91c1c;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .info-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            border-left: 3px solid #667eea;
        }
        
        .info-card label {
            display: block;
            font-size: 12px;
            color: #999;
            margin-bottom: 5px;
        }
        
        .info-card .value {
            font-size: 16px;
            font-weight: bold;
            color: #333;
        }
        
        .table-scroll {
            overflow-y: auto;
            max-height: 400px;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.show {
            display: flex;
        }
        
        .modal-content {
            background: white;
            border-radius: 8px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .modal-header {
            padding: 20px;
            border-bottom: 1px solid #e8eaed;
            font-weight: bold;
            font-size: 16px;
        }
        
        .modal-body {
            padding: 20px;
        }
        
        .modal-footer {
            padding: 20px;
            border-top: 1px solid #e8eaed;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        
        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .spinner {
            border: 3px solid #f0f0f0;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .legend {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 15px;
            font-size: 12px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 期权分析工具</h1>
        <p style="margin-top: 8px; font-size: 13px; opacity: 0.9;">完整的期权行情分析、组合构建和风险评估平台</p>
    </div>
    
    <div class="container">
        <!-- 数据加载区域 -->
        <div class="panel full-width">
            <div class="panel-header">📁 数据加载</div>
            <div class="panel-content">
                <div class="control-group">
                    <label>上传CSV数据文件</label>
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 15px;">
                        <div>
                            <label style="font-size: 12px; color: #666; margin-bottom: 5px; display: block;">期权合约信息</label>
                            <input type="file" id="optionInfoFile" accept=".csv" style="padding: 8px; cursor: pointer; font-size: 11px;">
                        </div>
                        <div>
                            <label style="font-size: 12px; color: #666; margin-bottom: 5px; display: block;">期权价格数据</label>
                            <input type="file" id="optionPriceFile" accept=".csv" style="padding: 8px; cursor: pointer; font-size: 11px;">
                        </div>
                        <div>
                            <label style="font-size: 12px; color: #666; margin-bottom: 5px; display: block;">ETF价格数据</label>
                            <input type="file" id="etfPriceFile" accept=".csv" style="padding: 8px; cursor: pointer; font-size: 11px;">
                        </div>
                    </div>
                </div>
                <div class="button-group">
                    <button class="btn btn-primary" onclick="loadDataFromFiles()">📂 加载数据文件</button>
                    <button class="btn btn-secondary" onclick="loadSampleData()">📋 使用示例数据</button>
                </div>
                <div id="dataStatus" style="margin-top: 10px; font-size: 12px; color: #999; padding: 10px; background: #f8f9fa; border-radius: 4px;">准备就绪</div>
            </div>
        </div>
        
        <!-- 主要内容区域 -->
        <div class="main-grid">
            <!-- ETF K线图 -->
            <div class="panel">
                <div class="panel-header">📈 ETF K线图</div>
                <div class="panel-content">
                    <div class="control-group">
                        <label>选择ETF标的</label>
                        <select id="etfSelect" onchange="updateETFChart()">
                            <option value="">加载数据后显示</option>
                        </select>
                    </div>
                    <div id="etfChart" class="chart-container"></div>
                </div>
            </div>
            
            <!-- T型报价表 -->
            <div class="panel">
                <div class="panel-header">💱 T型报价表</div>
                <div class="panel-content">
                    <div class="control-group">
                        <label>选择月份</label>
                        <select id="monthSelect" onchange="updateOptionTable()">
                            <option value="">加载数据后显示</option>
                        </select>
                    </div>
                    <div class="tabs">
                        <button class="tab active" onclick="switchTab('market')">行情</button>
                        <button class="tab" onclick="switchTab('value')">价值</button>
                        <button class="tab" onclick="switchTab('risk')">风险</button>
                        <button class="tab" onclick="switchTab('contract')">合约</button>
                    </div>
                    <div class="table-scroll">
                        <table class="table" id="optionTable">
                            <thead>
                                <tr id="tableHeader"></tr>
                            </thead>
                            <tbody id="tableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
            
            <!-- 期权详情和损益图 -->
            <div class="panel full-width">
                <div class="panel-header">📊 期权详情与损益分析</div>
                <div class="panel-content">
                    <div class="row">
                        <div style="flex: 1;">
                            <div class="info-grid" id="optionInfo" style="grid-template-columns: repeat(6, 1fr); margin-bottom: 20px;"></div>
                            <div id="selectedChart" class="chart-container"></div>
                        </div>
                        <div style="flex: 1; display: flex; flex-direction: column;">
                            <div style="background: #f8f9fa; padding: 15px; border-radius: 6px; margin-bottom: 20px;">
                                <h3 style="margin-bottom: 15px; font-size: 13px; font-weight: 600; color: #333;">📋 已选期权信息</h3>
                                <div id="selectedOptInfo" style="font-size: 12px; color: #666; line-height: 1.8;">
                                    <p>未选择期权</p>
                                </div>
                            </div>
                            <h3 style="margin-bottom: 15px; font-size: 13px; font-weight: 600; color: #333;">➕ 构建期权组合</h3>
                            <div class="table-scroll" style="flex: 1; overflow-y: auto; margin-bottom: 15px;">
                                <table class="table">
                                    <thead>
                                        <tr>
                                            <th>操作</th>
                                            <th>合约代码</th>
                                            <th>方向</th>
                                            <th>数量</th>
                                        </tr>
                                    </thead>
                                    <tbody id="portfolioTable"></tbody>
                                </table>
                            </div>
                            <div class="button-group" style="margin-bottom: 15px;">
                                <button class="btn btn-primary" onclick="addToPortfolio()" style="flex: 1;">➕ 添加到组合</button>
                                <button class="btn btn-danger" onclick="clearPortfolio()" style="flex: 1;">🗑️ 清空组合</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 损益图分析 -->
            <div class="panel full-width">
                <div class="panel-header">📉 期权组合损益图</div>
                <div class="panel-content">
                    <div id="portfolioChart" class="chart-container" style="min-height: 300px;"></div>
                </div>
            </div>
            
            <!-- 组合风险指标 -->
            <div class="panel full-width">
                <div class="panel-header">⚠️ 期权组合风险指标</div>
                <div class="panel-content">
                    <div class="row">
                        <div>
                            <h4 style="margin-bottom: 15px; font-size: 13px; color: #333; font-weight: 600;">📊 Greeks合计</h4>
                            <div class="info-grid" id="portfolioGreeks" style="grid-template-columns: repeat(3, 1fr); gap: 15px;">
                                <div class="info-card">
                                    <label>Delta合计</label>
                                    <div class="value" id="portfolioDelta">0.000</div>
                                </div>
                                <div class="info-card">
                                    <label>Gamma合计</label>
                                    <div class="value" id="portfolioGamma">0.000</div>
                                </div>
                                <div class="info-card">
                                    <label>Vega合计</label>
                                    <div class="value" id="portfolioVega">0.000</div>
                                </div>
                                <div class="info-card">
                                    <label>Theta合计</label>
                                    <div class="value" id="portfolioTheta">0.000</div>
                                </div>
                                <div class="info-card">
                                    <label>Rho合计</label>
                                    <div class="value" id="portfolioRho">0.000</div>
                                </div>
                                <div class="info-card">
                                    <label>总投入成本</label>
                                    <div class="value" id="portfolioCost">0.00</div>
                                </div>
                            </div>
                        </div>
                        <div>
                            <h4 style="margin-bottom: 15px; font-size: 13px; color: #333; font-weight: 600;">📈 风险收益统计</h4>
                            <div class="table-scroll">
                                <table class="table" style="font-size: 11px;">
                                    <thead>
                                        <tr>
                                            <th>指标</th>
                                            <th>数值</th>
                                            <th>评价</th>
                                        </tr>
                                    </thead>
                                    <tbody id="portfolioRiskTable"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="panel full-width">
                <div class="panel-header">🔮 股票价格预测（对数正态分布）</div>
                <div class="panel-content">
                    <div class="row">
                        <div>
                            <div class="control-group">
                                <label>预测天数</label>
                                <select id="daysSelect" onchange="updatePricePrediction()">
                                    <option value="3">3天后</option>
                                    <option value="5">5天后</option>
                                    <option value="10">10天后</option>
                                </select>
                            </div>
                            <div class="info-grid">
                                <div class="info-card">
                                    <label>预测价格（均值）</label>
                                    <div class="value" id="predictedPrice">-</div>
                                </div>
                                <div class="info-card">
                                    <label>标准差</label>
                                    <div class="value" id="predictedStd">-</div>
                                </div>
                                <div class="info-card">
                                    <label>置信区间95%</label>
                                    <div class="value" id="confidenceInterval">-</div>
                                </div>
                                <div class="info-card">
                                    <label>上升概率</label>
                                    <div class="value" id="upProbability">-</div>
                                </div>
                            </div>
                        </div>
                        <div>
                            <div id="predictionChart" class="chart-container"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 添加到组合对话框 -->
    <div id="addPortfolioModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                ➕ 添加期权到组合
                <span class="close-btn" onclick="closeModal('addPortfolioModal')">&times;</span>
            </div>
            <div class="modal-body">
                <div class="control-group">
                    <label>选择方向</label>
                    <select id="portfolioDirection">
                        <option value="long">做多（买入）</option>
                        <option value="short">做空（卖出）</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>选择数量</label>
                    <input type="number" id="portfolioQty" value="1" min="1">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('addPortfolioModal')">取消</button>
                <button class="btn btn-primary" onclick="confirmAddPortfolio()">确定</button>
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
